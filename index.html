<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda JS - Evaluación Portafolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <div class="container mb-5">
        <h1 class="text-center mb-5 display-5 fw-bold">Mi Tienda Online</h1>

        <div class="row">
            <div class="col-md-8">
                <h3 class="mb-4">Catálogo de Productos</h3>
                <div id="lista-productos" class="row row-cols-1 row-cols-md-2 g-4">
                    <div class="col text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div id="carrito-contenedor" class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">🛒 Carrito de Compras</h5>
                    </div>
                    <div class="card-body">
                        <ul id="lista-carrito" class="list-group list-group-flush mb-3">
                            <li class="list-group-item text-center text-muted">
                                Tu carrito está vacío
                            </li>
                        </ul>
                        
                        <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-3">
                            <span>Total:</span>
                            <span id="total-precio">$0.00</span>
                        </div>
                        
                        <button class="btn btn-success w-100 mt-3" onclick="alert('Funcionalidad de pago pendiente')">
                            Finalizar Compra
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
